name: Backend tesztek

# Az üzleti szabály tesztek (Vitest + supertest + embedded-postgres) minden
# PR-en és main-re pusholáskor lefutnak. Az embedded-postgres a CI-ban is
# maga tölti le a Postgres binárist — nincs szükség Docker service-re.
on:
  # Kézi indítás (Actions fül → Run workflow).
  # 2026-08-06-án egy GitHub Actions szolgáltatás-kiesés alatt a workflow-k
  # el sem indultak („some workflow runs are failing to start" — githubstatus
  # incidens, kritikus). Kiesés vagy elmaradt trigger után enélkül csak üres
  # commit pusholásával lehetett újrafuttatni a CI-t.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Backend tesztek
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A package-lock.json nincs verziókövetve, ezért npm install (nem npm ci).
      - name: Függőségek telepítése
        run: npm install

      - name: Függőség-audit (éles függőségek, magas/kritikus)
        run: node ../scripts/fuggoseg-audit.js .

      # ⚠️ EZ A LÉPÉS 2026-08-12-IG NEM KAPUZOTT. Piros suite mellett is
      # átment: a `pg.stop()` (embedded-postgres) a gyerekfolyamat kilövésekor
      # felülírta a vitest által beállított `process.exitCode`-ot, így a
      # parancs 0-val végzett, miközben a riport kiírta a „Tests N failed"-et.
      # A javítás a `backend/tests/global-setup.js` teardownjában van; hogy ne
      # nyílhasson ki újra némán, a `tests/ci-kapu-or.test.js` egy
      # ALFOLYAMATBAN lefuttat egy biztosan bukó tesztet, és nem-nulla
      # kilépési kódot követel. Ha ez a fájl valaha eltűnik, a kapu védtelen.
      - name: Tesztek futtatása lefedettséggel
        run: npm run test:coverage

      # Külön lépés: a vitest a küszöb-sértést kiírja, de NULLA kóddal lép ki
      # (lemérve) — ez a szkript az, ami tényleg elbuktatja a buildet.
      # ⚠️ UGYANAZ A HIBAOSZTÁLY, mint fent, csak egy szinttel lejjebb: a
      # „kiírja a hibát, de nullával lép ki" kétszer is előfordult ebben a
      # fájlban. Új kapunál MINDIG mérd le, hogy a bukás tényleg piros buildet
      # ad — a „fut a CI-ben" nem azonos a „kapuz"-zal.
      - name: Lefedettség-őr (nem csúszhat vissza)
        run: node ../scripts/lefedettseg-or.js .
