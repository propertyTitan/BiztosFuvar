name: Web tesztek

# Minden PR-en és main-re pusholáskor lefuttatja a web app tesztkészletét.
on:
  # Kézi indítás (Actions fül → Run workflow).
  # 2026-08-06-án egy GitHub Actions szolgáltatás-kiesés alatt a workflow-k
  # el sem indultak („some workflow runs are failing to start" — githubstatus
  # incidens, kritikus). Kiesés vagy elmaradt trigger után enélkül csak üres
  # commit pusholásával lehetett újrafuttatni a CI-t.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Web tesztek
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚠️ npm 11 (2026-09-10): a Node 22/20-szal érkező npm 10 a
      # „Cannot read properties of null (reading 'edgesOut')" hibával elhal
      # a vitest friss TRANSZITÍV peer-halmazán (a registry változott 08-31
      # után, nem a kód; lockfile nélkül minden friss install kitett ennek).
      # Az npm 11 ugyanazt a package.json-t hibátlanul feloldja (lemérve).
      - name: npm 11 (az npm 10 peer-feloldási hibája ellen)
        run: npm install -g npm@11

      # A package-lock.json VERZIÓKÖVETETT (2026-09-11, D6): npm ci — ha a
      # package.json és a lockfile szétcsúszik, a build itt bukik (ez a kapu).
      - name: Függőségek telepítése
        run: npm ci

      # Típusellenőrzés-kapu (2026-09-11, Codex P1-12): eddig egy típushiba csak
      # a Vercel-buildben derült ki (bukott build = régi deployment marad, némán).
      - name: Típusellenőrzés (tsc)
        run: npx tsc --noEmit

      - name: Függőség-audit (éles függőségek, magas/kritikus)
        run: node ../scripts/fuggoseg-audit.js .

      - name: Tesztek futtatása
        run: npm test
