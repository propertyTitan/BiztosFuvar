name: E2E tesztek (Playwright)

# Teljes-stack böngészős tesztek: beágyazott Postgres ← backend ← Next.js web.
# A Google Maps kulcs repo-secret (kliens-oldali, NEXT_PUBLIC_ kulcs — a prod
# bundle-ben amúgy is látható), a cím-keresés teszt valódi Places-szel megy.
on:
  # Kézi indítás (Actions fül → Run workflow).
  # 2026-08-06-án egy GitHub Actions szolgáltatás-kiesés alatt a workflow-k
  # el sem indultak („some workflow runs are failing to start" — githubstatus
  # incidens, kritikus). Kiesés vagy elmaradt trigger után enélkül csak üres
  # commit pusholásával lehetett újrafuttatni a CI-t.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: E2E tesztek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A package-lock.json nincs verziókövetve, ezért npm install (nem npm ci).
      - name: Backend függőségek
        working-directory: backend
        run: npm install

      - name: Web függőségek
        working-directory: web
        run: npm install

      - name: Playwright Chromium telepítése
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E tesztek futtatása
        working-directory: web
        run: npx playwright test

      - name: Playwright riport feltöltése hibánál
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
