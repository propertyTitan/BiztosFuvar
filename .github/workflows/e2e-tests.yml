name: E2E tesztek (Playwright)

# Teljes-stack böngészős tesztek: beágyazott Postgres ← backend ← Next.js web.
# A Google Maps kulcs repo-secret (kliens-oldali, NEXT_PUBLIC_ kulcs — a prod
# bundle-ben amúgy is látható), a cím-keresés teszt valódi Places-szel megy.
on:
  # Kézi indítás (Actions fül → Run workflow).
  # 2026-08-06-án egy GitHub Actions szolgáltatás-kiesés alatt a workflow-k
  # el sem indultak („some workflow runs are failing to start" — githubstatus
  # incidens, kritikus). Kiesés vagy elmaradt trigger után enélkül csak üres
  # commit pusholásával lehetett újrafuttatni a CI-t.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: E2E tesztek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚠️ npm 11 (2026-09-10): a Node 22/20-szal érkező npm 10 a
      # „Cannot read properties of null (reading 'edgesOut')" hibával elhal
      # a vitest friss TRANSZITÍV peer-halmazán (a registry változott 08-31
      # után, nem a kód; lockfile nélkül minden friss install kitett ennek).
      # Az npm 11 ugyanazt a package.json-t hibátlanul feloldja (lemérve).
      - name: npm 11 (az npm 10 peer-feloldási hibája ellen)
        run: npm install -g npm@11

      # A package-lock.json VERZIÓKÖVETETT (2026-09-11, D6): npm ci — ha a
      # package.json és a lockfile szétcsúszik, a build itt bukik (ez a kapu).
      - name: Backend függőségek
        working-directory: backend
        run: npm ci

      - name: Web függőségek
        working-directory: web
        run: npm ci

      - name: Playwright Chromium telepítése
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E tesztek futtatása
        working-directory: web
        run: npx playwright test

      - name: Playwright riport feltöltése hibánál
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
